<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Buggy Version</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Task Manager Application</h1>
            <div class="user-info">
                <span>Welcome, User</span>
                <!-- BUG: Missing logout button -->
            </div>
        </header>

        <!-- BUG: Overlapping navigation and content -->
        <nav class="navigation">
            <ul>
                <li><a href="#tasks">Tasks</a></li>
                <li><a href="#calendar">Calendar</a></li>
                <li><a href="#settings">Settings</a></li>
            </ul>
        </nav>

        <main class="main-content">
            <div class="task-form">
                <h2>Add New Task</h2>
                <form id="taskForm">
                    <input type="text" id="taskTitle" placeholder="Task Title" required>
                    <textarea id="taskDescription" placeholder="Task Description (Markdown supported)" rows="4"></textarea>
                    <div class="form-actions">
                        <!-- BUG: Submit button has display: none in CSS -->
                        <button type="submit" id="submitBtn">Add Task</button>
                        <button type="button" id="cancelBtn">Cancel</button>
                    </div>
                </form>
            </div>

            <!-- BUG: Grid layout broken with overlapping items -->
            <div class="task-grid">
                <div class="task-card" id="task1">
                    <h3>Complete Project Documentation</h3>
                    <div class="task-content" id="content1">
                        <!-- BUG: Markdown rendering issues -->
                        <p class="markdown-content"></p>
                    </div>
                    <div class="task-actions">
                        <button class="edit-btn">Edit</button>
                        <button class="delete-btn">Delete</button>
                    </div>
                </div>

                <div class="task-card" id="task2">
                    <h3>Review Code Changes</h3>
                    <div class="task-content" id="content2">
                        <p class="markdown-content"></p>
                    </div>
                    <div class="task-actions">
                        <button class="edit-btn">Edit</button>
                        <button class="delete-btn">Delete</button>
                    </div>
                </div>

                <div class="task-card" id="task3">
                    <h3>Update Dependencies</h3>
                    <div class="task-content" id="content3">
                        <p class="markdown-content"></p>
                    </div>
                    <div class="task-actions">
                        <button class="edit-btn">Edit</button>
                        <button class="delete-btn">Delete</button>
                    </div>
                </div>
            </div>
        </main>

        <!-- BUG: Footer overlaps with main content -->
        <footer class="footer">
            <p>&copy; 2025 Task Manager. All rights reserved.</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
